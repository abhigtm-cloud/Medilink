name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Get Flutter dependencies
        run: flutter pub get
      
      - name: Build release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: flutter build apk --release --android-skip-build-dependency-validation
      
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: medilink-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: "MediLink v1.0.5 Release - Location & Emergency Overhaul"
          draft: false
          prerelease: false
          body: |
            ## 🏥 MediLink v1.0.5 - Comprehensive Location & Emergency Overhaul

            ### 🚀 What's New & Fixed in v1.0.5:
            - **Accurate Distance & Live GPS Engine**: Overhauled location services to fetch real-time device GPS coordinates with instant fast-path caching. Fixed distance calculations to reflect accurate real-world distances.
            - **Human-Readable Place Names Everywhere**: Replaced raw coordinate strings across the entire app (User Home, Hospital Map, Emergency, Search, Add Hospital) with clean, readable place names (e.g., `Sector 70, Mohali, Punjab`, `Kharar, Punjab`).
            - **Dynamic Nearest-First Sorting**: All hospital lists (Home Screen, Hospital Map, Emergency Search, Doctor Discovery) are dynamically sorted nearest-to-farthest with clear distance chips (`📍 1.5 km away` / `800 m away`).
            - **Emergency Patient GPS & 1-Tap Google Maps Navigation**: Hospital Command Center displays patient live place name address and provides a direct 1-tap **"Open Patient Location in Google Maps"** navigation button.
            - **Emergency Approve / Accept Flow**: Seamless real-time state synchronization between User Emergency SOS and Hospital Command Center upon accepting emergency requests.
            - **View Doctors & Booking**: Fully functional doctor roster across hospital cards, map views, and search screen.

            ### 📱 Download & Install:
            Download the `app-release.apk` below directly onto your Android device!
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
