name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Get Flutter dependencies
        run: flutter pub get
      
      - name: Build release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: flutter build apk --release --android-skip-build-dependency-validation
      
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: medilink-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: "MediLink v1.0.6 Release - Interactive Geo Map & Fixes"
          draft: false
          prerelease: false
          body: |
            ## 🏥 MediLink v1.0.6 - Interactive Geo Map & Hospital Management Fixes

            ### 🚀 What's New & Fixed in v1.0.6:
            - **Interactive Geo Map Page**: Full-screen OpenStreetMap Geo Map with live GPS tracking, pulsing user marker, and custom interactive tags placed over every hospital's exact coordinates.
            - **Hospital Map Tags & Popups**: Tap any hospital tag on the map to highlight, view distance, view doctors, and open 1-tap Google Maps turn-by-turn navigation. Toggle between Map View and List View anytime.
            - **Hospital Deletion Bug Fixed**: Resolved root cause where deleting a hospital caused other hospitals to delete or reload sample data (fixed `Hospital.toJson()` ID serialization, added database safety guards, and removed dummy sample auto-seeding).
            - **Live GPS & Accurate Distance**: Device GPS fast-path caching and human-readable place names across the entire platform.

            ### 📱 Download & Install:
            Download the `app-release.apk` below directly onto your Android device!
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
