name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Get Flutter dependencies
        run: flutter pub get
      
      - name: Build release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: flutter build apk --release --android-skip-build-dependency-validation
      
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: medilink-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "MediLink v1.0.1 Release"
          draft: false
          prerelease: false
          body: |
            ## 🏥 MediLink v1.0.1 - Healthcare & Emergency Platform

            ### 🚀 Features Included:
            - **Real-Time Patient Booking & Live Slot Allocation**
            - **Emergency SOS Distress System with Instant Hospital Dispatch**
            - **Live Emergency Command Center with Timeline Tracking**
            - **Hospital Staff Hub (Doctor, Ambulance Driver & Pharmacy Roles)**
            - **Ambulance Fleet Tracking & Availability Management**
            - **Pharmacy Inventory & Prescription Verification System**
            - **Persistent Background Emergency Notification Banner**

            ### 📱 Download & Install:
            Download the `app-release.apk` below directly onto your Android device!
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
