name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Get Flutter dependencies
        run: flutter pub get
      
      - name: Build release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: flutter build apk --release --android-skip-build-dependency-validation
      
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: medilink-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "MediLink v1.0.3 Release"
          draft: false
          prerelease: false
          body: |
            ## 🏥 MediLink v1.0.3 - Healthcare & Emergency Platform (Latest Fixes)

            ### 🚀 Highlights & Fixes in v1.0.3:
            - **Live Emergency Command Center**: Full RTDB broadcast & instant sync — all hospital admins receive real-time SOS distress alerts regardless of hospital ID mapping.
            - **Ambulance Fleet Management**: Added Realtime Database backing & hospitalId registration to eliminate null instance / permission errors.
            - **Staff Hub & Cross-Module Auto-Sync**: Adding doctors or drivers automatically updates Doctor Rosters, Appointment Booking, and Ambulance Dispatch!
            - **Pharmacy Inventory & Prescriptions**: Fortified image handling and hospital fallback to prevent null instance crashes.
            - **Hospital Admin Dashboard**: Fully null-safe with Live Emergency Banner and direct Respond button.

            ### 📱 Download & Install:
            Download the `app-release.apk` below directly onto your Android device!
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
