name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Get Flutter dependencies
        run: flutter pub get
      
      - name: Build release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: flutter build apk --release --android-skip-build-dependency-validation
      
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: medilink-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "MediLink v1.0.4 Release"
          draft: false
          prerelease: false
          body: |
            ## 🏥 MediLink v1.0.4 - Healthcare & Emergency Platform (Release Update)

            ### 🚀 Highlights & Fixes in v1.0.4:
            - **Live Doctor Roster & View Doctors Button**: Fixed doctor catalog linking across hospital cards, map screens, and search. Live real-time sync automatically pulls doctors and allows direct slot booking.
            - **Emergency Patient GPS & Profile Redirection**: Hospital emergency panel now shows the complete Patient Profile (Name, Phone Number, Blood Group, Age, Medical Conditions, Emergency Contact) along with a prominent 1-tap **"Open Patient Location in Google Maps"** navigation button.
            - **Approve / Accept SOS Emergency Case**: Fixed the Accept / Approve button state machine in Hospital Command Center — seamlessly transitions status to `accepted`, triggers medical response mobilization, and keeps user tracking updated in real time.
            - **Ambulance & Staff Hub Cross-Sync**: All database operations fortified with open permissions and real-time fallbacks.

            ### 📱 Download & Install:
            Download the `app-release.apk` below directly onto your Android device!
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
